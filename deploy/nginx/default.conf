server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    client_max_body_size 1g;
    index index.html;

    location = /health {
        proxy_pass https://api-production-4521.up.railway.app/health;
        proxy_http_version 1.1;
        proxy_set_header Host api-production-4521.up.railway.app;
        proxy_ssl_server_name on;
        proxy_ssl_name api-production-4521.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass https://api-production-4521.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Host api-production-4521.up.railway.app;
        proxy_ssl_server_name on;
        proxy_ssl_name api-production-4521.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
