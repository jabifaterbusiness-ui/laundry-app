name: CI

on:
  pull_request:
    branches:
      - friend-work
  push:
    branches:
      - friend-work
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: laundryangel_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d laundryangel_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/laundryangel_ci?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters
      NODE_ENV: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build shared package
        run: npm run build:shared
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Apply database migrations
        run: npm run db:migrate:deploy --workspace=apps/api
      - name: Run API tests
        timeout-minutes: 15
        run: npm run test:api
      - name: Run web library, state and offline tests
        timeout-minutes: 12
        run: npm run test:web -- --reporter=verbose --pool=threads --maxWorkers=2 --minWorkers=1 --testTimeout=15000 --hookTimeout=15000 --teardownTimeout=10000 tests/lib tests/state tests/offline-subscription-payment-queue.test.ts tests/offline-sync-queue.test.ts
      - name: Run web component and app tests
        timeout-minutes: 12
        run: npm run test:web -- --reporter=verbose --pool=threads --maxWorkers=2 --minWorkers=1 --testTimeout=15000 --hookTimeout=15000 --teardownTimeout=10000 tests/components tests/App.test.tsx src/components/auth/SensitiveAuthorizationManager.test.tsx src/components/auth/SensitiveAuthorizationProvider.test.tsx
      - name: Run Orders page tests
        timeout-minutes: 6
        run: npm run test --workspace=apps/web -- --reporter=verbose --pool=forks --poolOptions.forks.singleFork --testTimeout=15000 --hookTimeout=15000 --teardownTimeout=10000 tests/pages/orders/OrdersPage.test.tsx
      - name: Run Order Management page tests
        timeout-minutes: 8
        run: npm run test --workspace=apps/web -- --reporter=verbose --pool=threads --maxWorkers=1 --minWorkers=1 --testTimeout=15000 --hookTimeout=15000 --teardownTimeout=10000 tests/pages/orders/OrderManagementPage.test.tsx
      - name: Run remaining web page tests (customers through invoices)
        timeout-minutes: 12
        run: npm run test:web -- --reporter=verbose --pool=threads --maxWorkers=2 --minWorkers=1 --testTimeout=15000 --hookTimeout=15000 --teardownTimeout=10000 tests/pages/customers tests/pages/data-management tests/pages/finance tests/pages/help tests/pages/inventory tests/pages/invoices
      - name: Run remaining web page tests (payments through users)
        timeout-minutes: 12
        run: npm run test:web -- --reporter=verbose --pool=threads --maxWorkers=2 --minWorkers=1 --testTimeout=15000 --hookTimeout=15000 --teardownTimeout=10000 tests/pages/payments tests/pages/reports tests/pages/services tests/pages/users src/pages/security/SuspiciousActivityPage.test.tsx
      - name: Lint API and web
        timeout-minutes: 10
        run: npm run lint
      - name: Typecheck API and web
        timeout-minutes: 10
        run: npm run typecheck
      - name: Build production applications
        timeout-minutes: 15
        run: npm run build

  deploy-staging:
    name: Deploy Phase 2 PR #36 to isolated staging
    needs: verify
    if: >-
      ${{ github.event_name == 'pull_request' &&
          contains(fromJSON('["fix/production-acceptance-corrections","fix/phase2-19-corrections-pr"]'), github.event.pull_request.head.ref) &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: laundryangel-staging
    env:
      STAGING_HOST: ${{ secrets.LAUNDRYANGEL_STAGING_HOST }}
      STAGING_USER: ${{ secrets.LAUNDRYANGEL_STAGING_USER }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.LAUNDRYANGEL_STAGING_SSH_KEY }}
      STAGING_KNOWN_HOSTS: ${{ secrets.LAUNDRYANGEL_STAGING_KNOWN_HOSTS }}
    steps:
      - name: Check one-time staging connection setup
        id: connection
        shell: bash
        run: |
          if [[ -z "$STAGING_HOST" || -z "$STAGING_USER" || -z "$STAGING_SSH_PRIVATE_KEY" || -z "$STAGING_KNOWN_HOSTS" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Staging deployment is safely skipped: GitHub staging connection secrets are not configured yet."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the exact CI-tested source
        if: steps.connection.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Configure verified SSH connection
        if: steps.connection.outputs.enabled == 'true'
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/laundryangel_staging"
          chmod 600 "$HOME/.ssh/laundryangel_staging"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Package the CI-tested source
        if: steps.connection.outputs.enabled == 'true'
        shell: bash
        run: git archive --format=tar.gz --output="/tmp/laundryangel-staging-$GITHUB_SHA.tar.gz" HEAD

      - name: Stream source to the restricted staging deploy command
        if: steps.connection.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="/tmp/laundryangel-staging-$GITHUB_SHA.tar.gz"
          git archive --format=tar.gz --output="$ARCHIVE" HEAD
          ssh -i "$HOME/.ssh/laundryangel_staging" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$STAGING_USER@$STAGING_HOST" "deploy $GITHUB_SHA" < "$ARCHIVE"

      - name: Report staging deployment skipped
        if: steps.connection.outputs.enabled != 'true'
        run: echo "CI passed. Add the four LAUNDRYANGEL_STAGING_* GitHub environment secrets to enable automatic staging deployment."


  preview-staging:
    name: Temporary authenticated staging browser preview
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/phase2-19-corrections-pr'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: laundryangel-staging
    env:
      STAGING_HOST: ${{ secrets.LAUNDRYANGEL_STAGING_HOST }}
      STAGING_USER: ${{ secrets.LAUNDRYANGEL_STAGING_USER }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.LAUNDRYANGEL_STAGING_SSH_KEY }}
      STAGING_KNOWN_HOSTS: ${{ secrets.LAUNDRYANGEL_STAGING_KNOWN_HOSTS }}
    steps:
      - name: Validate staging connection secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in STAGING_HOST STAGING_USER STAGING_SSH_PRIVATE_KEY STAGING_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required staging connection setting is missing: $name"
              exit 1
            fi
          done

      - name: Install password-protected reverse proxy
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nginx apache2-utils
          PREVIEW_PASSWORD="$(openssl rand -hex 18)"
          echo "::add-mask::$PREVIEW_PASSWORD"
          printf 'preview:%s\n' "$(openssl passwd -apr1 "$PREVIEW_PASSWORD")" | sudo tee /etc/nginx/.htpasswd >/dev/null
          sudo chmod 600 /etc/nginx/.htpasswd
          sudo tee /etc/nginx/sites-available/laundryangel-preview >/dev/null <<'NGINX'
          server {
            listen 127.0.0.1:18081;
            server_name _;
            auth_basic "LaundryAngel staging preview";
            auth_basic_user_file /etc/nginx/.htpasswd;
            location / {
              proxy_pass http://127.0.0.1:18080;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_read_timeout 3600s;
            }
          }
          NGINX
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo ln -s /etc/nginx/sites-available/laundryangel-preview /etc/nginx/sites-enabled/laundryangel-preview
          sudo nginx -t
          sudo systemctl restart nginx
          echo "PREVIEW_PASSWORD=$PREVIEW_PASSWORD" >> "$GITHUB_ENV"

      - name: Establish verified SSH tunnel to staging loopback
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/laundryangel_staging"
          chmod 600 "$HOME/.ssh/laundryangel_staging"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -N \
            -i "$HOME/.ssh/laundryangel_staging" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -L 127.0.0.1:18080:127.0.0.1:18080 \
            "$STAGING_USER@$STAGING_HOST" >/tmp/staging-ssh.log 2>&1 &
          echo "$!" > /tmp/staging-ssh.pid
          sleep 2
          kill -0 "$(cat /tmp/staging-ssh.pid)"
          HTTP_CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/)"
          [[ "$HTTP_CODE" == "401" ]]

      - name: Start temporary HTTPS tunnel
        shell: bash
        run: |
          set -euo pipefail
          CLOUDFLARED_VERSION="2026.10.7"
          curl --fail --location --silent --show-error \
            "https://github.com/cloudflare/cloudflared/releases/download/$CLOUDFLARED_VERSION/cloudflared-linux-amd64" \
            -o /tmp/cloudflared
          echo "1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872  /tmp/cloudflared" | sha256sum --check --status
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:18081 >/tmp/cloudflared.log 2>&1 &
          echo "$!" > /tmp/cloudflared.pid
          PREVIEW_URL=""
          for attempt in $(seq 1 60); do
            PREVIEW_URL="$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)"
            if [[ -n "$PREVIEW_URL" ]]; then break; fi
            sleep 2
          done
          if [[ -z "$PREVIEW_URL" ]]; then
            cat /tmp/cloudflared.log
            echo "::error::Cloudflare temporary HTTPS tunnel did not provide a URL."
            exit 1
          fi
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"

      - name: Publish temporary preview access details
        shell: bash
        run: |
          {
            echo "## LaundryAngel staging preview"
            echo
            echo "- URL: $PREVIEW_URL"
            echo "- Username: preview"
            echo "- Password: \`$PREVIEW_PASSWORD\`"
            echo "- Expires when this workflow run ends (maximum 60 minutes)."
            echo "- Password protection is enabled; the tunnel targets staging loopback port 18080 only."
            echo
            echo "Do not share these details publicly."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep preview available for browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          for remaining in $(seq 1 3300); do
            if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
              echo "::error::Temporary HTTPS tunnel stopped unexpectedly."
              exit 1
            fi
            sleep 1
          done

      - name: Stop temporary tunnels
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/cloudflared.pid ]]; then kill "$(cat /tmp/cloudflared.pid)" 2>/dev/null || true; fi
          if [[ -f /tmp/staging-ssh.pid ]]; then kill "$(cat /tmp/staging-ssh.pid)" 2>/dev/null || true; fi
