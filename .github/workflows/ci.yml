name: CI

on:
  pull_request:
    branches:
      - friend-work
  push:
    branches:
      - friend-work
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: laundryangel_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d laundryangel_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/laundryangel_ci?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters
      NODE_ENV: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build shared package
        run: npm run build:shared
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Apply database migrations
        run: npm run db:migrate:deploy --workspace=apps/api
      - name: Run API tests
        run: npm run test:api
      - name: Run web tests with per-test progress
        run: npm run test:web -- --reporter=verbose
      - name: Lint API and web
        run: npm run lint
      - name: Typecheck API and web
        run: npm run typecheck
      - name: Build production applications
        run: npm run build
