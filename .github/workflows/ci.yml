name: CI

on:
  pull_request:
    branches:
      - friend-work
  push:
    branches:
      - friend-work
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/laundryangel_ci?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters
      NODE_ENV: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build shared package
        run: npm run build:shared
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Run test suites
        run: npm test
      - name: Lint API and web
        run: npm run lint
      - name: Typecheck API and web
        run: npm run typecheck
      - name: Build production applications
        run: npm run build
